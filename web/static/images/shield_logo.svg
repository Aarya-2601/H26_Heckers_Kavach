<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Rich metallic gold gradient for outer border and bevels -->
    <linearGradient id="gold-metal-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eccb7a" />
      <stop offset="35%" stop-color="#c99f43" />
      <stop offset="70%" stop-color="#dfbd6a" />
      <stop offset="100%" stop-color="#8a611c" />
    </linearGradient>

    <!-- Inner gold crest gradient -->
    <linearGradient id="gold-metal-inner" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#f5d788" />
      <stop offset="40%" stop-color="#cca348" />
      <stop offset="80%" stop-color="#dfbe6c" />
      <stop offset="100%" stop-color="#996e23" />
    </linearGradient>

    <!-- 3D Chiseled Left Facet (Reflective dark charcoal) -->
    <linearGradient id="facet-left" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#2d3035" />
      <stop offset="60%" stop-color="#212326" />
      <stop offset="100%" stop-color="#181a1c" />
    </linearGradient>

    <!-- 3D Chiseled Right Facet (Deep shadow obsidian black) -->
    <linearGradient id="facet-right" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#1c1d20" />
      <stop offset="60%" stop-color="#131416" />
      <stop offset="100%" stop-color="#0b0c0d" />
    </linearGradient>

    <!-- Outer Rim Dark Fill -->
    <linearGradient id="outer-rim-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232528" />
      <stop offset="100%" stop-color="#141517" />
    </linearGradient>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#cca348" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Outer Gold Rim -->
  <path d="M 100 12 
           C 125 18 160 27 182 34 
           C 185 88 174 148 100 208 
           C 26 148 15 88 18 34 
           C 40 27 75 18 100 12 Z" 
        fill="url(#gold-metal-outer)" />

  <!-- 2. Dark Interstitial Layer (Body behind crest) -->
  <path d="M 100 16 
           C 123 22 157 30 177 37 
           C 180 88 170 144 100 201 
           C 30 144 20 88 23 37 
           C 43 30 77 22 100 16 Z" 
        fill="url(#outer-rim-dark)" />

  <!-- 3. Flanking Lower Curved Gold Wings / Crescents -->
  <!-- Left lower crescent -->
  <path d="M 44 142 
           C 53 162 72 182 92 195 
           C 78 186 61 170 48 147 
           C 45 141 43 135 41 129 
           C 41 133 42 138 44 142 Z" 
        fill="url(#gold-metal-outer)" />
  
  <!-- Right lower crescent -->
  <path d="M 156 142 
           C 147 162 128 182 108 195 
           C 122 186 139 170 152 147 
           C 155 141 157 135 159 129 
           C 159 133 158 138 156 142 Z" 
        fill="url(#gold-metal-outer)" />

  <!-- 4. Inner Gold Bevel Border (The sharp inner shield contour) -->
  <path d="M 100 32 
           C 124 39 152 47 167 52 
           C 165 92 151 144 100 184 
           C 49 144 35 92 33 52 
           C 48 47 76 39 100 32 Z" 
        fill="url(#gold-metal-inner)" 
        filter="url(#gold-glow)"/>

  <!-- 5. Central Shield Plate (Left Half - Chiseled Reflection) -->
  <path d="M 100 36 
           L 100 180 
           C 54 142 41 94 37 55 
           C 51 51 77 43 100 36 Z" 
        fill="url(#facet-left)" />

  <!-- 6. Central Shield Plate (Right Half - Deep Shadow) -->
  <path d="M 100 36 
           L 100 180 
           C 146 142 159 94 163 55 
           C 149 51 123 43 100 36 Z" 
        fill="url(#facet-right)" />

  <!-- 7. Subtle vertical 3D specular spine highlight -->
  <line x1="100" y1="34" x2="100" y2="180" stroke="rgba(255, 235, 170, 0.25)" stroke-width="1.2" />
</svg>
